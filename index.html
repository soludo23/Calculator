<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Calculator</title>
<style>
  body {
    background: #1a1a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
  }
  .calculator {
    background: #2d2d2d;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    width: 320px;
  }
  #display {
    width: 100%;
    height: 60px;
    font-size: 28px;
    text-align: right;
    margin-bottom: 15px;
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: #000;
    color: #0f0;
    box-sizing: border-box;
  }
  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  button {
    height: 60px;
    font-size: 20px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: #3d3d3d;
    color: white;
    transition: 0.2s;
  }
  button:hover { background: #4d4d4d; }
  .operator { background: #ff9500; }
  .operator:hover { background: #ffb140; }
  .equal { background: #0077ff; grid-column: span 2; }
  .equal:hover { background: #3393ff; }
  .clear { background: #ff3b30; }
</style>
</head>
<body>

<div class="calculator">
  <input type="text" id="display" readonly>
  
  <div class="buttons">
    <button class="clear" onclick="clearDisplay()">C</button>
    <button onclick="deleteLast()">DEL</button>
    <button onclick="appendValue('%')">%</button>
    <button class="operator" onclick="appendValue('/')">/</button>

    <button onclick="appendValue('7')">7</button>
    <button onclick="appendValue('8')">8</button>
    <button onclick="appendValue('9')">9</button>
    <button class="operator" onclick="appendValue('*')">*</button>

    <button onclick="appendValue('4')">4</button>
    <button onclick="appendValue('5')">5</button>
    <button onclick="appendValue('6')">6</button>
    <button class="operator" onclick="appendValue('-')">-</button>

    <button onclick="appendValue('1')">1</button>
    <button onclick="appendValue('2')">2</button>
    <button onclick="appendValue('3')">3</button>
    <button class="operator" onclick="appendValue('+')">+</button>

    <button onclick="appendValue('0')">0</button>
    <button onclick="appendValue('.')">.</button>
    <button class="equal" onclick="calculate()">=</button>
  </div>
</div>

<script>
  // Variables
  let display = document.getElementById("display");

  // Append value to display
  function appendValue(value) {
    display.value += value;
  }

  // Clear display - condition
  function clearDisplay() {
    display.value = "";
  }

  // Delete last character
  function deleteLast() {
    display.value = display.value.slice(0, -1);
  }

  // Calculate result - operators
  function calculate() {
    try {
      // This uses JS eval but safely because we control the input
      display.value = eval(display.value);
    } catch(error) {
      display.value = "Error";
      setTimeout(clearDisplay, 1500); // Clear error after 1.5s
    }
  }

  // Bonus: Keyboard support so it "lasts for ages"
  document.addEventListener("keydown", function(event) {
    let key = event.key;
    if("0123456789+-*/.%".includes(key)) {
      appendValue(key);
    } else if(key === "Enter") {
      calculate();
    } else if(key === "Backspace") {
      deleteLast();
    } else if(key === "Escape") {
      clearDisplay();
    }
  });
</script>

</body>
</html>
